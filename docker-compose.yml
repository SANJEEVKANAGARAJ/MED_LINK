version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: healthcare-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Backend API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: healthcare-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=healthcare_db
      - JWT_SECRET=7dK#91Lm@Qx2!aP8$VrN5zHcW4eYtU9
      - JWT_REFRESH_SECRET=K8@vP3#zLm91!QxT6$rNcW2aHyU7Fg
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_EXPIRES_IN=7d
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=23z258@psgtech.ac.in
      - SMTP_PASS=lrfc kttn cdus zbpm
      - EMAIL_FROM=23z258@psgtech.ac.in
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=AQ.Ab8RN6J8dZW5wherP2tzHwdHF87y2KMP5gM89pC9rRW6ciMy8g
      - GEMINI_MODEL=gemini-3.5-flash
      - FRONTEND_URL=http://healthcare-app.duckdns.org
      - GOOGLE_REDIRECT_URI=http://healthcare-app.duckdns.org/api/calendar/callback
    depends_on:
      - postgres

  # Frontend Nginx Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: healthcare-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
